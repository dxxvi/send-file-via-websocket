<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>&lt;--&gt;</title>
</head>

<body>
  <input type="file" id="fileInput">
  <button id="uploadBtn">Upload File</button>
  <div id="uploadIndicator" style="width: 50px; height: 50px; background-color: lightgray; border-radius: 50%; margin-top: 20px;"></div>

  <script>
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const indicator = document.getElementById("uploadIndicator");
      const file = document.getElementById("fileInput").files[0];

      if (!file) {
        alert("Please select a file first.");
        return;
      }

      const CHUNK_SIZE = 1024 * 1024;
      const ws = new WebSocket("ws://" + location.host + "/ws-upload");

      ws.onopen = async () => {
        indicator.style.backgroundColor = '#1e90ff';

        ws.send(file.name);

        for (let offset = 0; offset < file.size; offset += CHUNK_SIZE) {
          while (ws.bufferedAmount > 0) {
            await new Promise(resolve => setTimeout(resolve, 10));
          }
          ws.send(await file.slice(offset, offset + CHUNK_SIZE).arrayBuffer());
        }

        ws.close();
      };

      ws.onclose = () => {
        indicator.style.backgroundColor = '#32cd32';
      };

      ws.onerror = () => {
        indicator.style.backgroundColor = 'red';
      };
    });
  </script>
</body>

</html>
